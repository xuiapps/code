name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Required for Nerdbank.GitVersioning commit height

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Core Unit Tests
      run: dotnet test Xui/Core/Core.Tests/Xui.Core.Tests.csproj --verbosity normal --logger "trx;LogFileName=core.trx" --results-directory TestResults

    - name: Component Tests
      run: dotnet test Xui/Tests/Component/Xui.Tests.Component.csproj --verbosity normal --logger "trx;LogFileName=component.trx" --results-directory TestResults

    - name: Integration Tests
      run: dotnet test Xui/Tests/Integration/Xui.Tests.Integration.csproj --verbosity normal --logger "trx;LogFileName=integration.trx" --results-directory TestResults

    - name: Upload snapshot failure artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: snapshot-failures-${{ github.run_attempt }}
        path: |
          TestResults/**/*.trx
          Xui/Tests/Component/**/*.Actual.svg
          Xui/Tests/Component/**/Snapshots/**/*.svg
          Xui/Tests/Integration/**/README.DIFF.md
          Xui/Tests/Integration/**/*.DIFF.svg
          Xui/Tests/Integration/**/*.Render.svg
        if-no-files-found: warn
        retention-days: 14
